name: Tests

on:
  push:
    branches: [ main, security-hardening ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies and editable package
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run unit tests
      env:
        PYTHONPATH: src
      run: |
        python -m unittest discover -s tests -v

    - name: CLI smoke tests
      run: |
        envshield version
        envshield scan --help
        envshield check --help

    - name: Build package validation
      run: |
        python -m pip install build
        python -m build
