[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "envshield"
version = "0.2.0"
description = "High-speed, zero-runtime-dependency secret scanner and Git pre-commit security tool for developers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Tanjawi Dev" }
]
keywords = ["security", "secrets", "scanner", "git", "pre-commit", "linter", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/tanjawi-dev/envshield"
Issues = "https://github.com/tanjawi-dev/envshield/issues"

[project.scripts]
envshield = "envshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
